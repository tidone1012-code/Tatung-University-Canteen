<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大同學餐 · 位子插頭圖</title>
<style>
:root{--card:rgba(255,255,255,.92);--tx:#1a1a1a;--mut:#6b7378;--pri:#1f9d6b;--pri2:rgba(31,157,107,.1);--ok:#2fb464;--bad:#e5534b;--warn:#f0a921;--blue:#2a8bd6;--line:rgba(0,0,0,.07);--ink:#121619;--lime:#9be15d;--peach:#f6a05c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;color:var(--tx);background:#dcebd9;background-image:radial-gradient(70% 40% at 0% 0%,rgba(150,215,140,.55),transparent 70%),radial-gradient(60% 40% at 100% 20%,rgba(255,196,150,.5),transparent 70%),linear-gradient(180deg,#e3efe0 0%,#eef2e4 55%,#f8eadb 100%);background-attachment:fixed;font:15px/1.45 Inter,-apple-system,"SF Pro Text",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:16px 18px 8px}
header .sp{min-width:0}header h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.15}header small{font-size:13px}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;color:var(--tx);position:relative;padding:0;box-shadow:0 4px 12px rgba(40,70,50,.1)}
.rb img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.rb .dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}
main{flex:1;overflow-y:auto;padding:8px 16px 16px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;justify-content:space-around;margin:6px 14px 12px;padding:7px;background:#1b2125;border-radius:34px;box-shadow:0 10px 30px rgba(20,40,30,.3)}
nav button{border:0;background:none;color:#9aa3a8;display:flex;align-items:center;gap:6px;padding:11px 15px;border-radius:26px;font:600 14px inherit;font-family:inherit;position:relative}
nav button span{display:none}nav button.on{background:#fff;color:#121619}nav button.on span{display:inline}
.badge-n{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-style:normal}
.card{color:var(--tx);background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(40,70,50,.1)}
h3{margin:0 0 10px;font-size:20px;font-weight:700}
.sec{margin:20px 4px 8px;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:.6px}
.mut,small{color:var(--mut)}
.bub{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.bub img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#fff;border:2px solid #fff}
.bub div{color:var(--tx);background:#f1f4ef;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:14px}
.tip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:22px;padding:6px 14px 6px 6px;font-size:13px;margin-bottom:12px}
.tip img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.card .tip{background:rgba(0,0,0,.04);margin:12px 0 0}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.seg{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap}
.chip{border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.7);color:var(--tx);border-radius:50px;padding:10px 18px;font-size:14px;font-family:inherit;white-space:nowrap}
.chip.on{background:#121619;color:#fff;border-color:#121619;font-weight:700}
.card .chip,.sheet .chip{background:rgba(0,0,0,.06);border-color:transparent;padding:8px 14px}.card .chip.on,.sheet .chip.on{background:#121619;color:#fff}
.card .seg,.sheet .seg{flex-wrap:wrap}
.sg{display:inline-flex;background:rgba(0,0,0,.07);border-radius:50px;padding:3px}.sg.full{display:flex}
.sg button{border:0;background:none;padding:9px 16px;border-radius:50px;font:600 14px inherit;font-family:inherit;color:var(--mut)}.sg.full button{flex:1}
.sg button.on{background:#121619;color:#fff}
.live{font-size:12px;color:var(--ok)}.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.mapbox{overflow:auto;max-height:520px;border-radius:18px;margin-top:10px;background:#f7f7f4}
svg.map{display:block}
.zr{fill:rgba(31,157,107,.1);stroke:rgba(0,0,0,.08)}.zl{font-size:10px;fill:var(--mut);font-weight:700}
.wall{fill:#f7f7f4;stroke:#2b3338;stroke-width:3}.zp{stroke:rgba(0,0,0,.08);cursor:pointer}.zpa{fill:#e3e5e3}.zpb{fill:#d4e6f6}.zpc{fill:#fbe9cf}
.cn{fill:#c9ceca}.cnt{font-size:9px;fill:#2b3338;font-weight:700;pointer-events:none}.ch{fill:#aeb5b1}
.zt{font-size:11px;font-weight:800;fill:#2b3338;pointer-events:none}
.t{cursor:pointer;stroke:rgba(0,0,0,.25)}.ta{fill:var(--ok)}.tu{fill:var(--bad)}.tw{fill:var(--warn)}.tm{fill:var(--blue)}
.tt{font-size:8.5px;fill:#fff;font-weight:700;pointer-events:none}.pg{font-size:9px;pointer-events:none}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.hug{font-size:50px;font-weight:800;line-height:1;letter-spacing:-1.5px}.hug small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:4px}
.zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ztile{background:var(--pri2);border-radius:20px;padding:10px 12px;cursor:pointer}.ztile small{display:block}.ztile b{font-size:24px;line-height:1.2}.ztile em{font-size:12px;font-style:normal;color:var(--mut);font-weight:600}.ztile span{font-size:12px;font-weight:700}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.08);margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--lime),var(--peach),#f0707a)}
.bars{display:flex;gap:4px;height:90px}.bars div{flex:1;display:flex;align-items:flex-end}.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--peach),var(--lime));opacity:.5}.bars .cur i{opacity:1}
.pill{border-radius:12px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:#d6f3e0;color:#14733c}.p-bad{background:#fbdbd8;color:#b3261e}.p-warn{background:#fdebc2;color:#8a5a00}.p-blue{background:#d6e9f9;color:#17598f}.p-mut{background:var(--line);color:var(--mut)}
.btn{display:block;width:100%;border:0;border-radius:50px;padding:15px;font-size:15px;font-weight:700;background:var(--ink);color:#fff;margin-top:10px;font-family:inherit}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--ink)}.btn.g{background:linear-gradient(90deg,#2fb464,#7fcf5a);color:#fff}.btn.r{background:var(--bad)}.btn:disabled{opacity:.4}
.ev{display:flex;gap:10px;overflow-x:auto}.ev div{flex:none;width:150px;background:var(--pri2);border-radius:20px;padding:12px}.ev b{display:block;font-size:14px}.ev em{font-size:26px;font-style:normal}
.ban{border-radius:28px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,#2a8bd6,#1d6fb0);color:#fff;box-shadow:0 10px 24px rgba(30,90,150,.3)}
.ban .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.ban .btn{margin-top:8px;padding:12px;font-size:14px;background:#fff;color:#121619}.ban .btn.o{background:transparent;color:#fff;border-color:#fff}
.sheet-bg{position:absolute;inset:0;background:rgba(20,30,25,.5);display:none;align-items:flex-end;z-index:20}.sheet-bg.show{display:flex}
.sheet{color:var(--tx);background:#fbfbf8;width:100%;max-height:88%;overflow-y:auto;border-radius:32px 32px 0 0;padding:16px 18px 26px}
.grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:-6px auto 12px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.th{flex:none;width:50px;height:50px;border-radius:16px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:26px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:16px}
.stores{display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;padding-bottom:10px}
.sa{flex:none;width:74px;text-align:center;opacity:.65;font-size:12px}.sa.on{opacity:1;font-weight:700}
.av{position:relative;display:flex;width:62px;height:62px;border-radius:50%;background:#fff;align-items:center;justify-content:center;font-size:28px;margin:0 auto 8px;border:3px solid transparent;box-shadow:0 4px 12px rgba(40,70,50,.1)}.sa.on .av{border-color:var(--lime)}
.av em{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--peach);color:#fff;border-radius:9px;font-size:10px;font-style:normal;padding:0 7px;font-weight:700;white-space:nowrap}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-bottom:14px;height:128px;box-shadow:0 8px 20px rgba(40,70,50,.15)}.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.hero div{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:#14211d;border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:16px;padding:11px;background:rgba(0,0,0,.035);color:var(--tx);font:inherit;margin:4px 0 8px}
label{font-size:13px;color:var(--mut)}
.ph{height:140px;border:2px dashed rgba(0,0,0,.15);border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--mut);overflow:hidden;margin:4px 0 8px}.ph img{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.ov.show{display:flex}
#scan{background:#0b0f0e;color:#fff}
.qrf{width:210px;height:210px;border:3px solid #fff;border-radius:24px;position:relative;overflow:hidden;margin:16px 0;background:repeating-conic-gradient(#222 0 25%,#333 0 50%) 0 0/22px 22px}
.qrf::after{content:"";position:absolute;left:0;right:0;height:3px;background:#3fe0a8;box-shadow:0 0 12px #3fe0a8;animation:sc 1.4s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}
#ok,#onb{background:linear-gradient(160deg,#dcebd9,#eef2e4 55%,#f8eadb);overflow-y:auto}#onb{z-index:40}
.big-m{width:150px;border-radius:28px;margin-bottom:10px;box-shadow:0 10px 24px rgba(40,70,50,.2)}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:48px;line-height:84px;margin-bottom:10px}
.tbl{display:grid;grid-template-columns:20px 90px 20px;gap:6px;align-items:center;justify-content:center;margin:12px 0}.tbl i{height:20px;background:rgba(0,0,0,.12);border-radius:6px}.tbl b{height:80px;background:rgba(255,255,255,.7);border:2px solid var(--pri);border-radius:12px;display:flex;align-items:center;justify-content:center;grid-column:2;grid-row:1/4}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#121619;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}#toast.show{opacity:1}
.step{display:flex;gap:4px;font-size:11px;margin:8px 0 0}.step span{flex:1;text-align:center;padding:5px 0;border-radius:10px;background:var(--line);color:var(--mut)}.step span.d{background:var(--ok);color:#fff}
details{border-top:1px solid var(--line);padding:10px 0}summary{font-weight:600}
.stat{display:flex;gap:8px;margin-top:12px}.stat div{flex:1;background:var(--pri2);border-radius:18px;padding:10px;text-align:center}.stat b{font-size:22px;display:block}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(0,0,0,.15);position:relative;border:0}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.pm{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:8px}.pm.on{border-color:var(--pri);background:var(--pri2)}.pm em{font-size:22px;font-style:normal}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.15)}.dots i.on{background:var(--pri);width:22px}
.pqr{width:130px;height:130px;margin:10px auto;border-radius:16px;background:repeating-conic-gradient(#17201d 0 25%,#fff 0 50%) 0 0/16px 16px;border:6px solid #fff}
.zb{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px}
.seats{display:flex;gap:8px;margin:12px 0 6px}.seats i{width:30px;height:30px;border-radius:10px;border:2px dashed rgba(0,0,0,.22);transition:.25s}
.seats i.o{background:#9aa3a8;border:2px solid #9aa3a8}.seats i.m{background:var(--blue);border:2px solid var(--blue);animation:pop .5s}.seats i.p{background:var(--ok);border:2px solid var(--ok);animation:pop .35s}
.qty button:disabled{opacity:.3}
.rg{fill:none;stroke:var(--blue);animation:ring 1.6s ease-out infinite;pointer-events:none}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes tp{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes ring{0%{stroke-width:1;stroke-opacity:.9}100%{stroke-width:12;stroke-opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wid{from{width:0}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes glow{0%,100%{box-shadow:0 10px 24px rgba(30,90,150,.3)}50%{box-shadow:0 10px 34px rgba(42,139,214,.65)}}
@keyframes shim{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
main.in>*{animation:up .45s both}main.in>*:nth-child(2){animation-delay:.06s}main.in>*:nth-child(3){animation-delay:.12s}main.in>*:nth-child(4){animation-delay:.18s}main.in>*:nth-child(5){animation-delay:.24s}main.in>*:nth-child(6){animation-delay:.3s}main.in>*:nth-child(n+7){animation-delay:.36s}
.rb img,.tip img,.bub img,.big-m{animation:bob 3.2s ease-in-out infinite}
.tick{animation:pop .6s both}
.ta{animation:tp 2.2s ease-in-out infinite}.tm{animation:tp 1s ease-in-out infinite}
.bars i{transform-origin:bottom;animation:grow .7s both}
.bar i{animation:wid .9s both}
.sheet-bg.show{animation:fadein .2s}.sheet-bg.show .sheet{animation:slide .32s cubic-bezier(.2,.8,.2,1)}
#toast{transform:translate(-50%,14px)}#toast.show{transform:translate(-50%,0)}
.btn,.chip,.sg button,.ztile,.sa,.zb,.qty button{transition:transform .15s,background .2s,opacity .2s}
.btn:active,.chip:active,.ztile:active,.zb:active,.qty button:active,.sa:active{transform:scale(.95)}
.badge-n{animation:pop .4s}
.ov.show{animation:fadein .25s}
.hero img{animation:kb 14s ease-in-out infinite alternate}
.ban{animation:glow 2.4s ease-in-out infinite}
.step span.c{animation:shim 1.1s infinite}
.sa.on .av{animation:pop .4s,bob 2.6s .4s ease-in-out infinite}
.conf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function sheet(h){$("#sheet").innerHTML='<div class="grab"></div>'+h;$("#sbg").classList.add("show")}
function closeS(){$("#sbg").classList.remove("show")}
$("#sbg").onclick=e=>{if(e.target.id=="sbg")closeS()};
const money=n=>"NT$"+n,now=()=>new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
const mine=i=>(S.hold&&S.hold.id==i)||S.seat==i;
function cls(i){const t=T[i];if(mine(i))return"tm";if(t.st=="u")return"tu";return t.pl?"ta":"tw"}
function stBadge(i){const t=T[i];if(mine(i))return'<span class="pill p-blue">'+(S.seat==i?"你在此用餐":"已為你保留")+"</span>";return t.st=="a"?`<span class="pill p-ok">空位 ${t.seats-t.occ}／${t.seats}</span>`:'<span class="pill p-bad">已滿</span>'}
const plBadge=i=>T[i].pl?'<span class="pill p-ok">🔌 插座正常</span>':'<span class="pill p-warn">⚠ 插座故障</span>';
function zinfo(z){const L=ids(z),n=fs(z),t=ts(z),b=L.filter(i=>!T[i].pl).length;
if(!n)return['<span class="pill p-bad">已滿</span>',"（0／"+t+" 個座位）","已滿","已滿"];
if(b)return['<span class="pill p-warn">注意</span>',`（${n} 個空位・${b} 桌插座故障）`,n+" 空位","注意"];
return['<span class="pill p-ok">開放</span>',`（${n}／${t} 個空位）`,n+" 空位","開放"]}
function chairs(t){let s="";const k=Math.max(1,t.seats/2);for(let i=0;i<k;i++){const f=(i+.5)/k;
if(t.sh=="v"){const y=t.y+t.h*f-5;s+=`<rect class="ch" x="${t.x-5}" y="${y}" width="4" height="10" rx="2"/><rect class="ch" x="${t.x+t.w+1}" y="${y}" width="4" height="10" rx="2"/>`}
else{const x=t.x+t.w*f-5;s+=`<rect class="ch" x="${x}" y="${t.y-5}" width="10" height="4" rx="2"/><rect class="ch" x="${x}" y="${t.y+t.h+1}" width="10" height="4" rx="2"/>`}}return s}
function planMap(){let s=`<svg class="map" viewBox="0 0 340 462" style="width:${S.z*100}%"><path class="wall" d="M6 6H252V28H334V456H6Z"/>`;
["早餐店","玉福滷味","便當","手搖飲料"].forEach((n,i)=>s+=`<rect class="cn" x="${12+i*60}" y="10" width="56" height="20" rx="6"/><text class="cnt" x="${40+i*60}" y="24" text-anchor="middle">${n}</text>`);
s+='<text class="cnt" x="293" y="20" text-anchor="middle" style="fill:#8a9399">樓梯</text>';
[["A",34,100],["B",142,120],["C",270,88]].forEach(([z,y,h])=>{s+=`<rect class="zp zp${z.toLowerCase()}" data-z="${z}" x="8" y="${y}" width="322" height="${h}" rx="14"/><text class="zt" x="44" y="${y+13}">${z} 區・${zinfo(z)[2]}</text>`});
ids().forEach(id=>{const t=T[id],dim=S.filter&&!t.pl,cx=t.x+t.w/2,cy=t.y+t.h/2+3;
s+=`<g data-t="${id}" style="opacity:${dim?.25:1}">${chairs(t)}<rect class="t ${cls(id)}" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="5"/>${mine(id)?`<rect class="rg" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="5"/>`:""}<text class="tt" x="${cx}" y="${cy}" text-anchor="middle">${id}</text><text class="pg" x="${t.x+t.w+2}" y="${t.y+3}" text-anchor="end">${t.pl?"⚡":"⚠️"}</text></g>`});
return s+'<rect class="cn" x="12" y="372" width="86" height="70" rx="10" style="opacity:.6"/><text class="cnt" x="55" y="410" text-anchor="middle">餐具回收區</text><rect class="cn" x="232" y="372" width="96" height="70" rx="10" style="opacity:.6"/><text class="cnt" x="280" y="410" text-anchor="middle">飲水機／微波爐</text><path d="M128 456A36 36 0 0 1 164 420" fill="none" stroke="#2b3338" stroke-dasharray="3 3"/><text class="cnt" x="188" y="446" text-anchor="middle">▲ 入口</text></svg>'}
function zoneMap(){let y=6,s="";["A","B","C"].forEach(z=>{const L=ids(z),h=26+Math.ceil(L.length/4)*29;s+=`<rect class="zr" data-z="${z}" x="4" y="${y}" width="312" height="${h}" rx="14" style="cursor:pointer"/><text class="zl" x="12" y="${y+14}">${z} 區</text>`;
L.forEach((id,k)=>{const t=T[id],x=14+(k%4)*75,yy=y+22+((k/4)|0)*29,dim=S.filter&&!t.pl;s+=`<g data-t="${id}" style="opacity:${dim?.25:1}"><rect class="t ${cls(id)}" x="${x}" y="${yy}" width="66" height="24" rx="8"/><text class="tt" x="${x+33}" y="${yy+15}" text-anchor="middle">${id} ${t.pl?"⚡":"⚠"} ${t.seats-t.occ}/${t.seats}</text></g>`});y+=h+6});
return`<svg class="map" viewBox="0 0 320 ${y}" style="width:${S.z*100}%">${s}</svg>`}
function bindMap(){document.querySelectorAll("[data-t]").forEach(g=>g.onclick=()=>tableSheet(g.dataset.t));document.querySelectorAll("[data-z]").forEach(g=>g.onclick=()=>zoneSheet(g.dataset.z))}
function drawMap(){$("#mapw").innerHTML=S.mode=="zone"?zoneMap():planMap();bindMap()}
function zoom(d){S.z=Math.min(2.2,Math.max(1,S.z+d));drawMap()}
function banner(){if(S.hold)return`<div class="ban"><div class="row"><b>🪑 ${S.hold.id}・${S.hold.n} 人 已為你保留</b><span class="sp"></span><span class="big" id="cd">--:--</span></div><button class="btn" onclick="scan()">📷 到現場掃描 QR 入座</button><div class="row"><button class="btn o" onclick="occupied()">現場已被占用</button><button class="btn o" onclick="cancelHold()">取消預留</button></div></div>`;
if(S.seat)return`<div class="ban" style="background:linear-gradient(135deg,#2fb464,#1f8f4c)"><b>✅ 用餐中・${S.seat}（${S.seatN} 人）</b><button class="btn" onclick="release()">結束用餐／釋放座位</button></div>`;return""}
function seatDots(id){const t=T[id],m=mine(id),mn=m?(S.hold&&S.hold.id==id?S.hold.n:S.seatN):0,oth=t.occ-mn,p=m||t.st!="a"?0:S.pn;let s="";for(let k=0;k<t.seats;k++)s+=`<i class="${k<oth?"o":k<oth+mn?"m":k<oth+p?"p":""}"></i>`;return`<div class="seats">${s}</div><small>灰色＝已有人・藍色＝你的位子・綠色＝你要預留的・虛線＝空位</small>`}
function pnAdj(id,d){S.pn+=d;tableSheet(id,1)}
function tableSheet(id,keep){const t=T[id],free=t.seats-t.occ;if(!keep)S.pn=1;S.pn=Math.max(1,Math.min(S.pn,free||1));let b="",x="";
if(mine(id))b=S.hold?'<button class="btn g" onclick="closeS();scan()">掃描 QR 入座</button>':'<button class="btn" onclick="closeS();release()">結束用餐／釋放座位</button>';
else if(free>0){x=`<div class="row" style="margin:14px 0 4px"><b class="sp">用餐人數</b><div class="qty"><button onclick="pnAdj('${id}',-1)" ${S.pn<=1?"disabled":""}>−</button><b style="min-width:48px;text-align:center;font-size:20px">${S.pn} 人</b><button onclick="pnAdj('${id}',1)" ${S.pn>=free?"disabled":""}>＋</button></div></div>`;b=`<button class="btn g" onclick="reserve('${id}')">預留 ${S.pn} 位・10 分鐘</button>`}
else b='<button class="btn" disabled>目前已滿</button>';
if(!t.pl||mine(id))b+=`<button class="btn o" onclick="closeS();go('report','${id}')">📷 拍照回報故障</button>`;
sheet(`<h3>桌位 ${id}（${id[0]} 區）</h3><div class="row" style="flex-wrap:wrap">${stBadge(id)}${plBadge(id)}<span class="pill p-mut">🪑 ${t.seats} 人座</span></div>`+seatDots(id)+x+mas(t.st=="a"&&t.pl?"這桌有空位、插座也正常，推薦你！":t.st=="a"?"這桌有空位，但插座壞了，要帶行動電源喔。":"這桌有人了，看看其他綠色的桌子吧！")+b)}
function zoneSheet(z){const q=zinfo(z);sheet(`<h3>${z} 區桌位</h3><div class="row">${q[0]}<small>${q[1]}</small></div>`+ids(z).map(i=>`<div class="item" onclick="tableSheet('${i}')"><b style="width:36px">${i}</b>${stBadge(i)}${plBadge(i)}</div>`).join(""))}
function homeTip(){return S.hold?"記得 10 分鐘內到座位掃描 QR Code 喔！":S.seat?"用餐愉快！離開前別忘了釋放座位～":S.filter?"目前只顯示插座正常的桌子，需要充電就選它們！":"點地圖上的綠色桌子、選好人數就能預留座位，11:30–13:00 最擁擠喔！"}
const HR=[18,32,48,62,96,100,88,58,40,52,70,46,28];
function stats(){const a=ids().filter(i=>T[i].st=="a");return{n:fs(),p:a.filter(i=>T[i].pl).length,t:ts()}}
function ztile(z){const q=zinfo(z),L=ids(z),n=fs(z),t=ts(z),c=!n?"var(--bad)":L.some(i=>!T[i].pl)?"var(--warn)":"var(--ok)";
return`<div class="ztile" onclick="zoneSheet('${z}')"><small>${z} 區</small><b>${n}<em>／${t}</em></b><div class="bar"><i style="width:${Math.round((t-n)/t*100)}%"></i></div><span style="color:${c}">● ${q[3]}</span></div>`}
function sumCard(){const s=stats(),has=!S.hold&&!S.seat;
return`<div class="card"><div class="row"><div class="sp"><small>目前空位</small><div class="hug" id="hugn">${s.n}<small>／${s.t} 個座位</small></div></div><div style="text-align:right"><span class="live">即時</span><br><span class="pill p-ok" style="display:inline-block;margin-top:6px">🔌 ${s.p} 桌插座正常</span></div></div><div class="zgrid">${["A","B","C"].map(ztile).join("")}</div>${has?'<button class="btn g" onclick="findBest()">🔌 幫我找有插座的空位</button>':""}${tip(homeTip())}</div>`}

h+=`<div class="card"><div class="row"><h3 style="margin:0" class="sp">即時地圖</h3><button class="zb" onclick="zoom(-.4)" aria-label="縮小">−</button><button class="zb" onclick="zoom(.4)" aria-label="放大">＋</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap"><div class="sg"><button class="${S.mode=="plan"?"on":""}" onclick="S.mode='plan';home()">平面圖</button><button class="${S.mode=="zone"?"on":""}" onclick="S.mode='zone';home()">分區圖</button></div><button class="chip ${S.filter?"on":""}" onclick="S.filter=!S.filter;home()">🔌 只看有插座</button></div><div class="mapbox" id="mapw"></div><div class="leg"><span><i style="background:var(--ok)"></i>空位</span><span><i style="background:var(--bad)"></i>使用中</span><span><i style="background:var(--warn)"></i>空位但插座故障</span><span><i style="background:var(--blue)"></i>我的位子</span><span>⚡插座正常　⚠插座故障</span></div></div>`;

function reserve(id){if(S.hold||S.seat){toast("你已經有一個座位了");return}const n=S.pn;T[id].occ+=n;upd(id);S.hold={id,n,end:Date.now()+6e5};closeS();note(id+" 已預留 "+n+" 位，請於 10 分鐘內入座");toast(id+" 已預留 "+n+" 位，剩 10:00");go("home")}
function cancelHold(){const h=S.hold;T[h.id].occ-=h.n;upd(h.id);S.hold=null;toast("已取消預留");go("home")}
function occupied(){const id=S.hold.id;S.reports.unshift({id,type:"座位被占",time:now(),note:"預留者抵達時座位已被占用",st:"處理中"});T[id].occ=T[id].seats;upd(id);S.hold=null;toast("已通報現場佔用，請重新選位");go("home")}
function release(){const id=S.seat;T[id].occ=Math.max(0,T[id].occ-S.seatN);upd(id);S.seat=null;S.pts+=10;$("#ok").classList.remove("show");toast("座位已釋放，+10 點，謝謝你！");go("home")}

if(cnt())h+=`<button class="btn g" style="position:sticky;bottom:0;box-shadow:0 8px 20px rgba(30,100,60,.35)" onclick="cartSheet()">🛒 查看購物車・${cnt()} 項・${money(sum())}</button>`;

function addc(key,d){const[s,k]=key.split("-");let c=S.cart[key];if(!c){if(d<0)return;const it=MENU[s].i[k];c=S.cart[key]={n:it[0],p:it[1],q:0,s:MENU[s].n}}c.q+=d;if(c.q<=0)delete S.cart[key];order()}
let D=null;
function drinkSheet(k){D={k,su:2,ic:2,sz:0,tp:[]};drk()}
function drk(){const it=MENU[4].i[D.k],p=it[1]+D.sz*10+D.tp.length*10,sg=(a,v,f)=>a.map((x,i)=>`<button class="chip ${v(i)?"on":""}" onclick="${f(i)}">${x}</button>`).join("");
sheet(`<div class="row"><span class="th">${it[2]}</span><div class="sp"><h3 style="margin:0">${it[0]}</h3><small>${money(it[1])}</small></div></div><label>甜度</label><div class="seg">${sg(SUG,i=>D.su==i,i=>`D.su=${i};drk()`)}</div><label>冰量</label><div class="seg">${sg(ICE,i=>D.ic==i,i=>`D.ic=${i};drk()`)}</div><label>杯型</label><div class="seg">${sg(["中杯","大杯 +10"],i=>D.sz==i,i=>`D.sz=${i};drk()`)}</div><label>加料（每項 +10，可複選）</label><div class="seg">${sg(TOP,i=>D.tp.includes(i),i=>`D.tp=D.tp.includes(${i})?D.tp.filter(x=>x!=${i}):[...D.tp,${i}].sort();drk()`)}</div><button class="btn g" onclick="addDrink()">加入購物車・${money(p)}</button>`)}
function addDrink(){const it=MENU[4].i[D.k],key=`4-${D.k}-${D.su}-${D.ic}-${D.sz}-${D.tp.join("")}`,o=[SUG[D.su],ICE[D.ic],D.sz?"大杯":"中杯",...D.tp.map(i=>TOP[i])].join("・");
(S.cart[key]=S.cart[key]||{n:it[0],p:it[1]+D.sz*10+D.tp.length*10,q:0,s:"手搖飲料",o}).q++;closeS();toast("已加入 "+it[0]);order()}
function ordCard(o){return`<div class="card"><div class="row"><b>#${o.id}</b><span class="pill ${o.paid?"p-ok":"p-warn"}">${o.paid?"已付款":"取餐時付款"}</span><span class="sp"></span><span class="pill ${o.st==2?"p-ok":"p-blue"}">${OST[o.st]}</span></div><small>${o.items}<br>${money(o.total)}・${o.pay}・${o.seat?"送到 "+o.seat:"自取 "+o.when}</small><div class="step">${OST.map((s,i)=>`<span class="${i<=o.st?"d"+(i==o.st&&o.st<2?" c":""):""}">${s}</span>`).join("")}</div></div>`}
function cartSheet(){if(!cnt()){closeS();return}sheet(`<h3>購物車</h3>`+Object.entries(S.cart).map(([k,c])=>`<div class="item"><div class="sp"><b>${c.n}</b><br><small>${c.o||c.s}</small></div><div class="qty"><button onclick="addc('${k}',-1);cartSheet()">−</button><b>${c.q}</b><button onclick="addc('${k}',1);cartSheet()">＋</button></div><b style="width:64px;text-align:right">${money(c.q*c.p)}</b></div>`).join("")+`<div class="row" style="margin-top:10px"><b>小計</b><span class="sp"></span><b>${money(sum())}</b></div><button class="btn g" onclick="paySheet()">前往結帳</button>`)}
const disc=()=>S.usePts?Math.min(Math.floor(S.pts/100)*10,sum()):0;
function paySheet(){const tot=sum(),d=disc();sheet(`<h3>結帳</h3>`+`<div style="padding:0 4px">`+Object.values(S.cart).map(c=>`<div class="row" style="padding:5px 0"><span class="sp">${c.n} ×${c.q}${c.o?`<br><small>${c.o}</small>`:""}</span>${money(c.q*c.p)}</div>`).join("")+`</div><div class="sec" style="margin-left:0">取餐方式</div><select id="pk"><option>盡快（約 10 分鐘）</option><option>12:00</option><option>12:15</option><option>12:30</option><option>12:45</option></select>${S.seat?`<label class="row"><input type="checkbox" id="ds" style="width:auto;margin:0" checked> 送到座位 ${S.seat}</label>`:""}<div class="sec" style="margin-left:0">付款方式</div>`+PAY.map(p=>`<div class="pm ${S.pm==p[0]?"on":""}" onclick="S.pm='${p[0]}';paySheet()"><em>${p[1]}</em><span class="sp">${p[2]}</span>${S.pm==p[0]?"✓":""}</div>`).join("")+(S.pts>=100?`<div class="row" style="margin:8px 0"><span class="sp">使用 ${Math.floor(S.pts/100)*100} 點折抵 ${money(Math.floor(S.pts/100)*10)}</span><button class="sw ${S.usePts?"on":""}" onclick="S.usePts=!S.usePts;paySheet()"></button></div>`:"")+`<div class="row" style="margin-top:10px"><span class="sp">小計</span>${money(tot)}</div>${d?`<div class="row"><span class="sp">點數折抵</span>−${money(d)}</div>`:""}<div class="row" style="font-size:20px"><b class="sp">應付金額</b><b>${money(tot-d)}</b></div><button class="btn g" id="pb" onclick="pay()">${S.pm=="cash"?"確認下單":"確認付款 "+money(tot-d)}</button>`)}
function pay(){const b=$("#pb");b.disabled=true;b.textContent="處理中…";const tot=sum(),d=disc(),p=PAY.find(x=>x[0]==S.pm);

$("#main").innerHTML=tip("發現插座沒電？拍張照片告訴學校，大家就不用再踩雷囉！")+`<div class="card"><h3>回報問題</h3><label>① 哪一桌？</label><select id="rt">${o}</select><label>② 發生什麼事？</label><div class="seg" id="rty">${RT.map((x,i)=>`<button class="chip ${i==S.rty?"on":""}" onclick="pickTy(${i})">${x}</button>`).join("")}</div><label>③ 拍張現場照片</label><label class="ph" id="php">📷 點擊拍照／選擇照片<input type="file" accept="image/*" capture="environment" id="rf" hidden></label><label>補充說明（選填）</label><textarea id="rn" rows="2" placeholder="例如：插頭插上沒有電"></textarea><button class="btn g" onclick="sendRep()">送出回報給學校</button></div><div class="sec">回報紀錄</div>`+(S.reports.length?S.reports.map(r=>`<div class="card"><div class="row"><b>${r.id}・${r.type}</b><span class="sp"></span><span class="pill ${r.st=="已修復"?"p-ok":"p-warn"}">${r.st}</span></div><small>${r.time} ${r.note||""}</small></div>`).join(""):mas("還沒有回報紀錄。"));
$("#rf").onchange=e=>{const f=e.target.files[0];if(f)$("#php").innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`};nav()}
function sendRep(){const id=$("#rt").value,ty=RT[S.rty],r={id,type:ty,time:now(),note:$("#rn").value,st:"處理中"};if(ty=="插座故障")T[id].pl=0;S.reports.unshift(r);S.pts+=20;S.rty=0;note("已收到 "+id+" 的回報");toast("已送出，+20 點，謝謝回報！");report();setTimeout(()=>{r.st="已修復";if(ty=="插座故障")T[id].pl=1;note(id+" 已修復");if(S.tab=="report")report()},15000)}
